# WP Next Automation — control plane stack
# Used by install.sh. Local/OSS builds from PORTAL_BUILD_CONTEXT / DASHBOARD_BUILD_CONTEXT.
# Production VPS: enable caddy profile (ports 80/443). Local/ngrok: host ports only.

services:
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/boom-devs/wp-next-automation-backend:1.0.0}
    build:
      context: ${PORTAL_BUILD_CONTEXT:-../frontis-cloud-portal}
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RUN_MIGRATIONS: "true"
    volumes:
      - portal_storage_app:/var/www/html/storage/app
      - portal_storage_logs:/var/www/html/storage/logs
      - portal_storage_framework:/var/www/html/storage/framework
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    ports:
      - "${PORTAL_HOST_PORT:-8010}:80"
    expose:
      - "80"

  worker:
    image: ${PORTAL_IMAGE:-ghcr.io/boom-devs/wp-next-automation-backend:1.0.0}
    build:
      context: ${PORTAL_BUILD_CONTEXT:-../frontis-cloud-portal}
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=bulk-finalize,bulk-chunks,bulk-content,provisioning,default", "--timeout=900", "--tries=3", "--sleep=3"]
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
      SKIP_DB_WAIT: "false"
    volumes:
      - portal_storage_app:/var/www/html/storage/app
      - portal_storage_logs:/var/www/html/storage/logs
      - portal_storage_framework:/var/www/html/storage/framework
    depends_on:
      db:
        condition: service_healthy
      portal:
        condition: service_started

  scheduler:
    image: ${PORTAL_IMAGE:-ghcr.io/boom-devs/wp-next-automation-backend:1.0.0}
    build:
      context: ${PORTAL_BUILD_CONTEXT:-../frontis-cloud-portal}
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    volumes:
      - portal_storage_app:/var/www/html/storage/app
      - portal_storage_logs:/var/www/html/storage/logs
      - portal_storage_framework:/var/www/html/storage/framework
    depends_on:
      db:
        condition: service_healthy
      portal:
        condition: service_started

  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/boom-devs/wp-next-automation-dashboard:1.0.0}
    build:
      context: ${DASHBOARD_BUILD_CONTEXT:-../wp-next-automation-dashbaord}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_APP_URL: ${APP_URL:-http://localhost:8000}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-localhost}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-https}
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "${DASHBOARD_HOST_PORT:-3010}:3000"
    expose:
      - "3000"
    depends_on:
      - portal

  reverb:
    image: ${PORTAL_IMAGE:-ghcr.io/boom-devs/wp-next-automation-backend:1.0.0}
    build:
      context: ${PORTAL_BUILD_CONTEXT:-../frontis-cloud-portal}
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"
    ports:
      - "${REVERB_HOST_PORT:-8090}:8080"
    expose:
      - "8080"
    depends_on:
      - portal

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wp_next_automation}
      MYSQL_USER: ${DB_USERNAME:-wpnext}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:alpine
    restart: unless-stopped

  # Production TLS terminator. Skipped when ports 80/443 are busy (Herd/local).
  # Enable: COMPOSE_PROFILES=caddy docker compose up -d
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - dashboard
      - reverb

volumes:
  mysql_data:
  portal_storage_app:
  portal_storage_logs:
  portal_storage_framework:
  caddy_data:
  caddy_config:
