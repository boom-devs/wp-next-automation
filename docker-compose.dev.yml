# WP Next Automation — Local Developer Sandbox Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Or:
#   make dev

services:
  portal:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
    ports:
      - "${PORTAL_HOST_PORT:-8010}:80"

  dashboard:
    environment:
      NODE_ENV: development
    ports:
      - "${DASHBOARD_HOST_PORT:-3010}:3000"

  db:
    ports:
      - "${DEV_DB_PORT:-13306}:3306"

  redis:
    ports:
      - "${DEV_REDIS_PORT:-16379}:6379"
